[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notification-service-import-only"
version = "0.1.0"
description = "Small import-only Outlook notification client"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.11,<3", "pydantic-settings>=2.8,<3"]

[project.optional-dependencies]
graph = ["azure-identity>=1.21,<2"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
