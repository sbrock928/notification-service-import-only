[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "notification-service-import-only"
version = "0.1.0"
description = "Import-only email and Teams notification client with replaceable providers"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.28,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
graph = ["azure-identity>=1.21,<2"]
outlook-win32 = ["pywin32>=308; sys_platform == 'win32'"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["azure.*", "pythoncom", "win32com.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["notification_service"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
